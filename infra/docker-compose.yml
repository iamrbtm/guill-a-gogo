# Production Compose stack for Guill-a-Gogo.
#
# PostgreSQL and Redis do NOT publish host ports. Only the API joins the
# external reverse-proxy network (set EXTERNAL_NETWORK to match your proxy).
# The reverse proxy itself is managed outside this project.

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      RP_ID: ${RP_ID}
      RP_ORIGIN: ${RP_ORIGIN}
      RP_NAME: ${RP_NAME}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      INVITATION_BASE_URL: ${INVITATION_BASE_URL}
      EXTERNAL_NETWORK: ${EXTERNAL_NETWORK:-webproxy_net}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal
      - external_proxy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: ["celery", "-A", "worker.celery_app.celery", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-none}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: ["celery", "-A", "worker.celery_app.celery", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-guill}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-guill}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  backup:
    image: postgres:17
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_DB: ${POSTGRES_DB:-guill}
      POSTGRES_HOST: postgres
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 86400; done"]
    restart: unless-stopped
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  backups:

networks:
  internal:
    driver: bridge
  # The external reverse-proxy network is managed outside this project.
  # Its host name is taken from EXTERNAL_NETWORK; only the API joins it.
  external_proxy:
    external: true
    name: ${EXTERNAL_NETWORK:-webproxy_net}
